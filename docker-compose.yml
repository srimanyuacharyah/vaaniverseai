version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VAANIVERSE_DATA_DIR=/data
    volumes:
      - ./data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - redis
    environment:
      - VAANIVERSE_DATA_DIR=/data
    volumes:
      - ./data:/data
    command: ["/bin/sh", "-c", "rq worker --with-scheduler --url redis://redis:6379"]
